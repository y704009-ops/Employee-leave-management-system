<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" fill="none">
  <defs>
    <!-- Continuous Base Ribbon Gradient -->
    <linearGradient id="wkFavRibbon" x1="18" y1="50" x2="102" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="22%" stop-color="#0284c7" />
      <stop offset="48%" stop-color="#06b6d4" />
      <stop offset="78%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Center Arch Gradient -->
    <linearGradient id="wkFavCenter" x1="38" y1="76" x2="68" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="75%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- 3 Heads Radial Gradients -->
    <radialGradient id="favHeadBlue" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </radialGradient>
    <radialGradient id="favHeadCyan" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </radialGradient>
    <radialGradient id="favHeadPurple" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </radialGradient>

    <!-- Center Shadow for depth -->
    <filter id="favShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-1" dy="2" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 3 Spherical Heads -->
  <circle cx="23" cy="15" r="9.5" fill="url(#favHeadBlue)" />
  <circle cx="60" cy="15" r="9.5" fill="url(#favHeadCyan)" />
  <circle cx="97" cy="15" r="9.5" fill="url(#favHeadPurple)" />

  <!-- Base Continuous Ribbon W -->
  <path
    d="M 23 34 C 23 56, 32 78, 43 78 C 53 78, 55 48, 60 34 C 65 48, 67 78, 77 78 C 88 78, 97 56, 97 34"
    stroke="url(#wkFavRibbon)"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 3D Overlapping Center Peak -->
  <path
    d="M 40 76 C 49 62, 54 34, 60 34 C 66 34, 71 62, 79 74"
    stroke="url(#wkFavCenter)"
    stroke-width="15"
    stroke-linecap="round"
    filter="url(#favShadow)"
  />
</svg>
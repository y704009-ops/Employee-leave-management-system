server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: elms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:demo}
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  jwt:
    secret: ${JWT_SECRET:this_is_a_very_secure_secret_key_for_elms_application_2026_spring_boot_jwt_32bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
